name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (circuits crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins 1.89.0; install it explicitly so rustup never guesses.
      - name: Install pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: cargo check -p encrypted-ixs
        run: cargo check -p encrypted-ixs --locked
      # `cargo check -p blindcourt` is deliberately NOT run: the program's Arcium proc
      # macros (circuit_hash!, #[arcium_callback], #[init_computation_definition_accounts])
      # read build/<circuit>.arcis, .hash and .weight, which only `arcium build`
      # (Arcium CLI + Docker) produces, and build/ is gitignored. See AUDIT_SCOPE.md.

  circuits:
    name: Release circuits match pinned hashes
    runs-on: ubuntu-latest
    steps:
      - name: Download circuits-v3 and verify SHA-256
        run: |
          base=https://github.com/PugarHuda/saring/releases/download/circuits-v3
          cat > SHA256SUMS <<'EOF'
          28e35f9ee6dccb77b07dd0b2663309c46a01da5ddc84be96449ddf317a379f98  init_court_v3.arcis
          08758e5e360fd5516b98d9373f79f8e901d38b8ba445cb0c2154353838d9256c  add_juror_v3.arcis
          7ccfeb7fab44d75612f5832c015d7fd410b2d6378519810b7c050070d73f9de7  record_positions_v3.arcis
          cb883abb35904d3867d37ca96cf1aa9c14ee0aca0fde8607cdc85c8acf3b2748  cast_v3.arcis
          2bea557e86943860e8dc72729cb303b875db5076b1fc410463758d465b444a46  resolve_v3.arcis
          EOF
          for f in $(awk '{print $2}' SHA256SUMS); do curl -fsSL --retry 3 -o "$f" "$base/$f"; done
          sha256sum -c SHA256SUMS

  app:
    name: App + API (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - name: Install app deps
        run: yarn install --frozen-lockfile
        working-directory: app
      - name: Build app (tsc --noEmit + vite build)
        run: yarn --cwd app build
      - name: Syntax-check Vercel functions
        run: for f in app/api/*.js; do node --check "$f"; done
      - name: Type-check sdk (if present)
        run: |
          if [ -f sdk/package.json ]; then
            # The SDK's peer deps (anchor, arcium client, web3.js, @types/node)
            # come from the repo root, exactly like a local checkout.
            yarn install --frozen-lockfile
            npx tsc -p sdk --noEmit
          else
            echo "sdk/package.json not present; skipping"
          fi
